name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact .
  build:
    name: Build & test (auto-detected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check README has been filled in
        if: github.repository != 'Blockchains/hackathon-entry-template'
        run: |
          if grep -q '<Project name>' README.md; then echo "::warning::README still has template placeholders"; fi
      - name: Node (package.json)
        if: hashFiles('package.json') != ''
        run: |
          npm ci || npm install
          npm run build --if-present
          npm test --if-present
      - name: Python (requirements.txt / pyproject.toml)
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          python3 -m pip install -q -r requirements.txt 2>/dev/null || python3 -m pip install -q .
          python3 -m pip install -q pytest && (pytest -q || [ $? -eq 5 ])
      - name: Foundry (foundry.toml)
        if: hashFiles('foundry.toml') != ''
        uses: foundry-rs/foundry-toolchain@v1
      - name: Forge build & test
        if: hashFiles('foundry.toml') != ''
        run: forge build && forge test
